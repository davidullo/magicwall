name: MagicWall
options:
  bundleIdPrefix: app.magicwall
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: NO
packages:
  MagicWallCore:
    path: Packages/MagicWallCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  MagicWall:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MagicWall
    dependencies:
      - package: MagicWallCore
        product: MagicWallCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.magicwall
        PRODUCT_NAME: MagicWall
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MagicWall/Info.plist
      properties:
        CFBundleDisplayName: MagicWall
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MagicWall"
        NSHighResolutionCapable: true
        # Sparkle auto-updates. The feed is the appcast.xml attached to the
        # latest GitHub release, so the URL never changes between versions.
        # SUPublicEDKey is the public half of the EdDSA key generated once with
        # Sparkle's `generate_keys` (private key lives in the login keychain;
        # back it up, it is required to sign every future update).
        SUFeedURL: https://github.com/davidullo/magicwall/releases/latest/download/appcast.xml
        SUPublicEDKey: CojlMizGL3KbVVVeyghTURg8Sd2gxgkcBFxvwN7j4iA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        CFBundleURLTypes:
          - CFBundleURLName: app.magicwall.deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [magicwall]

  MagicWallUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MagicWallUITests
    dependencies:
      - target: MagicWall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.magicwall.uitests
        TEST_TARGET_NAME: MagicWall
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  MagicWall:
    build:
      targets:
        MagicWall: all
        MagicWallUITests: [test]
    test:
      config: Debug
      targets:
        - MagicWallUITests
      environmentVariables:
        # Path of the seeded library prepared by Scripts/e2e.sh. The shell
        # environment is not forwarded to the UI-test runner by xcodebuild,
        # so the value lives in the scheme (and must stay in sync with the
        # script). Without it the tests fall back to the real library.
        MW_E2E_SEEDED_DATA_DIR: /tmp/mw-e2e-data/seeded
    run:
      config: Debug
    archive:
      config: Release
