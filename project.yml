name: MagicWall
options:
  bundleIdPrefix: app.magicwall
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: NO
    # Shared by the app and the wallpaper extension — notarization rejects a
    # bundle whose extension carries a different version, so this pair is the
    # single source of truth and the release scripts bump it (every occurrence)
    # together.
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "6"
packages:
  MagicWallCore:
    path: Packages/MagicWallCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  MagicWall:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MagicWall
    dependencies:
      - package: MagicWallCore
        product: MagicWallCore
      - package: Sparkle
      - target: MagicWallWallpaperExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.magicwall
        PRODUCT_NAME: MagicWall
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MagicWall/Info.plist
      properties:
        CFBundleDisplayName: MagicWall
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MagicWall"
        NSHighResolutionCapable: true
        # Sparkle auto-updates. The feed is the appcast.xml attached to the
        # latest GitHub release, so the URL never changes between versions.
        # SUPublicEDKey is the public half of the EdDSA key generated once with
        # Sparkle's `generate_keys` (private key lives in the login keychain;
        # back it up, it is required to sign every future update).
        SUFeedURL: https://github.com/davidullo/magicwall/releases/latest/download/appcast.xml
        SUPublicEDKey: CojlMizGL3KbVVVeyghTURg8Sd2gxgkcBFxvwN7j4iA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        CFBundleURLTypes:
          - CFBundleURLName: app.magicwall.deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [magicwall]

  # Lock screen + desktop video wallpapers through Apple's own wallpaper
  # pipeline (provider for `com.apple.wallpaper`). Requires macOS 26+; on
  # earlier systems the app keeps using the desktop-level window engine.
  # Extension code is adapted from Phosphene (MIT) — see NOTICE.md.
  MagicWallWallpaperExtension:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MagicWallWallpaperExtension
        excludes:
          - Info.plist
          - NOTICE.md
          - LICENSE-Phosphene.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.magicwall.wallpaper-extension
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: MagicWallWallpaperExtension/MagicWallWallpaperExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_OBJC_BRIDGING_HEADER: MagicWallWallpaperExtension/WallpaperExtension-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    info:
      path: MagicWallWallpaperExtension/Info.plist
      properties:
        CFBundlePackageType: XPC!
        CFBundleDisplayName: MagicWall Wallpaper
        # Must match the app: the system and notarization both expect the
        # extension to carry the same version as its container.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.wallpaper

  MagicWallUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MagicWallUITests
    dependencies:
      - target: MagicWall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.magicwall.uitests
        TEST_TARGET_NAME: MagicWall
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  MagicWall:
    build:
      targets:
        MagicWall: all
        MagicWallUITests: [test]
    test:
      config: Debug
      targets:
        - MagicWallUITests
      environmentVariables:
        # Path of the seeded library prepared by Scripts/e2e.sh. The shell
        # environment is not forwarded to the UI-test runner by xcodebuild,
        # so the value lives in the scheme (and must stay in sync with the
        # script). Without it the tests fall back to the real library.
        MW_E2E_SEEDED_DATA_DIR: /tmp/mw-e2e-data/seeded
    run:
      config: Debug
    archive:
      config: Release
